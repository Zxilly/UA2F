name: Same-runner performance

# Expensive measurements are opt-in, never a permanent PR/merge gate.
on:
  # Temporary, explicitly approved one-shot registration. Removed after this run.
  push:
    branches: [perf/nfqueue-transport-20260930]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full baseline commit SHA
        required: true
        type: string
        default: 4ff67c3770cb2dabc6f1427ef19277df093aafc1
      run_diagnostics:
        description: Also collect separate CPU/syscall diagnostics
        required: false
        type: boolean
        default: false
      kernel_iteration:
        description: Focus on NFQUEUE with same-runner DIRECT references
        required: false
        type: boolean
        default: false
      candidate_empty_ack:
        description: Test opt-in empty-ACK rules in isolated namespaces (explicit approval required)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/perf/nfqueue-transport-20260930' &&
       github.event.head_commit.message == 'bench: run approved empty-ACK experiment once')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: ${{ inputs.base_sha || 'f7965c1b5d4b0f31b8a97bc332b93db55e6c63ab' }}
      CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: Initialize runner-local paths
        shell: bash
        run: |
          echo "RESULTS=$RUNNER_TEMP/ua2f-performance" >> "$GITHUB_ENV"
          echo "BUILD_ROOT=$RUNNER_TEMP/ua2f-performance-build" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake golang-go iproute2 iptables kmod strace \
            libnetfilter-queue-dev libmnl-dev libnetfilter-conntrack-dev nftables

      - name: Check benchmark accounting and firewall rule semantics
        run: |
          python3 test/benchmark_compare_test.py
          python3 scripts/test_firewall_rules.py

      - name: Build base and candidate identically
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "base_sha must be a full lowercase commit SHA" >&2; exit 1; }
          mkdir -p "$RESULTS" "$BUILD_ROOT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git worktree add --detach "$BUILD_ROOT/base-source" "$BASE_SHA"
          flags=(-DCMAKE_BUILD_TYPE=RelWithDebInfo -DUA2F_BUILD_TESTS=OFF
                 -DUA2F_ENABLE_UCI=OFF -DUA2F_ENABLE_BACKTRACE=OFF
                 -DUA2F_ENABLE_ASAN=OFF -DUA2F_ENABLE_COVERAGE=OFF -DUA2F_NO_CACHE=OFF)
          # Explicit toolchains and no compiler-cache reuse for either build.
          for variant in base candidate; do
            source="$GITHUB_WORKSPACE"
            if [[ "$variant" == base ]]; then source="$BUILD_ROOT/base-source"; fi
            env -u UA2F_ENABLE_ASAN CC=/usr/bin/gcc CXX=/usr/bin/g++ \
              cmake -S "$source" -B "$BUILD_ROOT/$variant" "${flags[@]}" \
              2>&1 | tee "$RESULTS/$variant-configure.log"
            cmake --build "$BUILD_ROOT/$variant" --parallel 2 \
              2>&1 | tee "$RESULTS/$variant-build.log"
            cp "$BUILD_ROOT/$variant/CMakeCache.txt" "$RESULTS/$variant-CMakeCache.txt"
          done
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          metadata = {
              "base_sha": os.environ["BASE_SHA"], "candidate_sha": os.environ["CANDIDATE_SHA"],
              "build_type": "RelWithDebInfo", "uci": False, "backtrace": False,
              "asan": False, "coverage": False, "cache": True,
              "compiler": subprocess.check_output(["/usr/bin/gcc", "--version"], text=True),
              "packages": subprocess.check_output(["dpkg-query", "-W", "gcc", "g++", "cmake",
                  "libmnl-dev", "libnetfilter-queue-dev", "libnetfilter-conntrack-dev"], text=True),
              "runner_image": os.environ.get("ImageOS"),
              "runner_image_version": os.environ.get("ImageVersion"),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_repository": os.environ["GITHUB_REPOSITORY"],
          }
          pathlib.Path(os.environ["RESULTS"], "build-metadata.json").write_text(json.dumps(metadata, indent=2))
          PY

      - name: Verify candidate rules on IPv4 and IPv6 before timing
        if: inputs.candidate_empty_ack || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          namespace="ua2f-empty-ack-${GITHUB_RUN_ID}"
          cleanup() {
            sudo ip netns pids "$namespace" 2>/dev/null | xargs -r sudo kill || true
            sudo ip netns delete "$namespace" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo ip netns add "$namespace"
          sudo ip netns exec "$namespace" ip link set lo up
          sudo timeout --signal=TERM --kill-after=15s 3m \
            ip netns exec "$namespace" python3 scripts/test_empty_ack_netns.py \
            --binary "$BUILD_ROOT/candidate/ua2f" --helper "$GITHUB_WORKSPACE/openwrt/files/ua2f.firewall" \
            --output-dir "$RESULTS/empty-ack-correctness" \
            2>&1 | tee "$RESULTS/empty-ack-correctness.log"

      - name: Run six counterbalanced pairs per workload
        shell: bash
        run: |
          set -euo pipefail
          namespace="ua2f-performance-${GITHUB_RUN_ID}"
          cleanup() {
            sudo ip netns pids "$namespace" 2>/dev/null | xargs -r sudo kill || true
            sudo ip netns delete "$namespace" 2>/dev/null || true
          }
          trap cleanup EXIT
          # No host firewall, routes, sysctls, or external network traffic are changed.
          sudo ip netns add "$namespace"
          sudo ip netns exec "$namespace" ip link set lo up
          extra=()
          if [[ "${{ inputs.kernel_iteration }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            extra+=(--modes NFQUEUE --include-direct)
          fi
          if [[ "${{ inputs.candidate_empty_ack }}" == "true" || "${{ github.event_name }}" == "push" ]]; then
            extra+=(--candidate-firewall-helper "$GITHUB_WORKSPACE/openwrt/files/ua2f.firewall")
          fi
          sudo timeout --signal=TERM --kill-after=15s 18m \
            ip netns exec "$namespace" python3 scripts/benchmark_compare.py \
            --base "$BUILD_ROOT/base/ua2f" --base-sha "$BASE_SHA" \
            --candidate "$BUILD_ROOT/candidate/ua2f" --candidate-sha "$CANDIDATE_SHA" \
            --pairs 6 --requests 100000 --warmup 10000 --concurrency 128 \
            --body-sizes 1024 65536 --nfqueue-workers 1 --proxy-workers 1 \
            --build-metadata "$RESULTS/build-metadata.json" --output-dir "$RESULTS" "${extra[@]}" \
            2>&1 | tee "$RESULTS/runner.log"

      - name: Profile routed workload bottlenecks separately
        if: inputs.run_diagnostics
        shell: bash
        run: |
          set -euo pipefail
          namespace="ua2f-profile-${GITHUB_RUN_ID}"
          cleanup() {
            sudo ip netns pids "$namespace" 2>/dev/null | xargs -r sudo kill || true
            sudo ip netns delete "$namespace" 2>/dev/null || true
          }
          trap cleanup EXIT
          mkdir -p "$RESULTS/profile"
          sudo ip netns add "$namespace"
          sudo ip netns exec "$namespace" ip link set lo up
          # Read-only process/cgroup counters; tracing never enters A/B timings.
          # No perf_event_paranoid, ptrace, sysctl, or host-network changes.
          sudo timeout --signal=TERM --kill-after=15s 8m \
            ip netns exec "$namespace" python3 scripts/profile_routed.py \
            --candidate "$BUILD_ROOT/candidate/ua2f" --candidate-sha "$CANDIDATE_SHA" \
            --profile-requests 50000 --warmup 5000 --trace-requests 2000 --trace-warmup 200 \
            --concurrency 128 --body-sizes 1024 65536 --nfqueue-workers 1 --proxy-workers 1 \
            --output-dir "$RESULTS/profile" 2>&1 | tee "$RESULTS/profile/runner.log"

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$RESULTS/summary.md" ]]; then
            cat "$RESULTS/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Benchmark did not complete. See build/runner logs; no performance claim is available.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$RESULTS/profile/summary.md" ]]; then
            cat "$RESULTS/profile/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve raw measurements and build metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ua2f-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.RESULTS }}/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
